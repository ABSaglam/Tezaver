[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tezaver"
version = "4.0.0"
description = "Tezaver Platform - Mac/Matrix/Cloud Trading System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ali Saglam", email = "absaglam@gmail.com"}
]
keywords = ["trading", "crypto", "binance", "platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "python-binance>=1.0.17",
    "requests>=2.28.0",
    "boto3>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tezaver-mac-agent = "tezaver.platform.cli.mac_agent_cli:main"
tezaver-matrix-agent = "tezaver.platform.cli.matrix_agent_cli:main"
tezaver-cloud-agent = "tezaver.platform.cli.cloud_agent_cli:main"
tezaver-panel = "tezaver.platform.cli.panel_cli:main"
tezaver-bus-backup = "tezaver.platform.cli.bus_backup_cli:main"
tezaver-smoke = "tezaver.platform.cli.smoke_cli:main"

[project.urls]
Homepage = "https://github.com/absaglam/tezaver"
Documentation = "https://github.com/absaglam/tezaver/tree/main/docs"
Repository = "https://github.com/absaglam/tezaver"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
