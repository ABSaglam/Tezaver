<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" fill="none">
  <defs>
    <!-- UNIFIED: White gradient for text -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
    <!-- LIVE: Turquoise gradient for "live" text -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
    
    <!-- LIVE: Turquoise gradient for icon hexagon (animated) -->
    <linearGradient id="icon_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1">
        <animate attributeName="stop-color" values="#00E5FF;#00BCD4;#18FFFF;#00E5FF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00838F;stop-opacity:1">
        <animate attributeName="stop-color" values="#00838F;#006064;#00ACC1;#00838F" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- LIVE: Gold gradient for T shape -->
    <linearGradient id="icon_grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="turquoise_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#00E5FF" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- SYMBOL (Scaled down) -->
  <g transform="translate(0, 5) scale(0.2)">
      <path d="M200 50 L350 125 L350 275 L200 350 L50 275 L50 125 Z" 
            stroke="url(#icon_grad1)" stroke-width="16" fill="none" filter="url(#turquoise_glow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
      </path>
      <circle cx="50" cy="125" r="15" fill="#00E5FF">
        <animate attributeName="fill" values="#00E5FF;#18FFFF;#00E5FF" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="350" cy="125" r="15" fill="#00E5FF">
        <animate attributeName="fill" values="#00E5FF;#18FFFF;#00E5FF" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="350" r="15" fill="#00E5FF">
        <animate attributeName="fill" values="#00E5FF;#18FFFF;#00E5FF" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="50" r="15" fill="#00E5FF">
        <animate attributeName="fill" values="#00E5FF;#18FFFF;#00E5FF" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <path d="M100 120 L300 120 L280 160 L120 160 Z" fill="url(#icon_grad2)" filter="url(#glow)" />
      <path d="M170 160 L230 160 L220 300 L180 300 Z" fill="url(#icon_grad2)" filter="url(#glow)" />
      <circle cx="200" cy="200" r="25" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite" />
      </circle>
  </g>

  <!-- TEXT Group -->
  <g transform="translate(75, 0)">
      <!-- Main Text: TEZAVER (Gold) -->
      <text x="10" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="url(#icon_grad2)" letter-spacing="1.5" filter="url(#glow)">TEZAVER</text>
      
      <!-- Sub Text: live (Turquoise with shimmer) -->
      <text x="215" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="200" font-size="36" fill="url(#grad1)" letter-spacing="0" filter="url(#turquoise_glow)">live
        <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
      </text>
      
      <!-- Version Text -->
      <text x="305" y="75" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="0">by Ali Sağlam (v1.0 Live Trading)</text>
  </g>
</svg>
