name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
      
      - name: Run tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py"
      
      - name: Generate coverage report
        run: |
          PYTHONPATH=src python -m coverage run --source=tezaver.matrix.live -m unittest discover -s tests -p "test_*.py"
          PYTHONPATH=src python -m coverage report -m --include="*/tezaver/matrix/live/*"
          PYTHONPATH=src python -m coverage html -d coverage_html --include="*/tezaver/matrix/live/*"
          PYTHONPATH=src python -m coverage xml -o coverage.xml --include="*/tezaver/matrix/live/*"
      
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14
      
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
